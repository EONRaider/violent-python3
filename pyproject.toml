[project]
name = "violent-python3"
version = "2.0.0"
description = "Python 3 conversion of the source code from the book \"Violent Python\" by TJ O'Connor."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "EONRaider" }]
keywords = ["violent-python", "penetration-testing", "offensive-security", "python3", "book"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
# This repository is a collection of standalone scripts, not an installable
# package. All third-party requirements live in per-chapter dependency groups
# below so that readers can install exactly what a chapter needs.
dependencies = []

[project.urls]
Homepage = "https://github.com/EONRaider/violent-python3"
Issues = "https://github.com/EONRaider/violent-python3/issues"
Changelog = "https://github.com/EONRaider/violent-python3/blob/master/CHANGELOG.md"

# PEP 735 dependency groups, one per chapter. Keep these in sync with
# `tools/deps_scan.toml`; `python tools/deps_scan.py check` enforces it in CI.
[dependency-groups]
# crypt was removed from the stdlib in Python 3.13 (PEP 594);
# standard-crypt is a drop-in backport that provides the same module name.
# Like the stdlib module it wraps libc crypt(3), so it is Unix-only.
#
# Version policy: floors are the oldest release that installs on 3.10-3.14 and
# has no known advisories. Libraries whose API the book code depends on are
# capped below their next major version; Dependabot proposes major bumps so
# each one can be validated against the code before it lands.
ch01 = ["standard-crypt>=3.13.0; python_version >= '3.13' and sys_platform != 'win32'"]
ch02 = ["pexpect>=4.9.0", "python-nmap>=0.7.1"]
ch03 = ["beautifulsoup4>=4.12.3", "pillow>=10.4.0", "pypdf4>=1.27.0", "requests>=2.32.4"]
ch04 = ["dpkt>=1.9.8", "geoip2>=4.8.1,<5", "ipy>=1.1", "scapy>=2.6.1,<3"]
ch05 = ["scapy>=2.6.1,<3"]
# Opt-in: PyBluez needs BlueZ headers (`apt install libbluetooth-dev`) and its
# last PyPI release (0.23, 2020) does not build on modern setuptools, so it is
# built from a pinned upstream commit. Linux only.
ch05-bluetooth = [
    "pybluez @ git+https://github.com/pybluez/pybluez@82cbba8a1ebd4c1e3442dfafd8581d58c50fa39e ; sys_platform == 'linux'",
]
ch06 = ["beautifulsoup4>=4.12.3", "mechanicalsoup>=1.3.0,<2"]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.uv]
package = false
# `uv sync` installs every chapter by default; opt-in groups are excluded
# because they need system libraries. Enable them with `--group <name>`.
default-groups = ["ch01", "ch02", "ch03", "ch04", "ch05", "ch06", "dev"]

# Linting and type-checking cover the repository tooling only. The book code
# under chapterNN/ is intentionally kept close to the printed listings.
[tool.ruff]
target-version = "py310"
line-length = 100
include = ["tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "RUF", "D", "ANN", "PT", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tools/tests/**" = ["D", "ANN", "PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tools"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tools/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
